<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .game-area {
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-box,
        .high-score-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            min-width: 150px;
        }

        canvas {
            border: 3px solid #333;
            background-color: #000;
            display: block;
            margin: 20px auto;
            border-radius: 5px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            text-align: left;
            font-size: 0.9em;
            color: #555;
            max-width: 250px;
            align-self: flex-start;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .instructions p {
            margin: 5px 0;
        }

        .options {
            margin-top: 15px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            text-align: left;
            font-size: 0.9em;
            color: #555;
            max-width: 250px;
        }

        .options h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            cursor: pointer;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-container label {
            cursor: pointer;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }

        .game-over h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .game-over p {
            color: #666;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
            margin-left: 5px;
            margin-right: 5px;
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="instructions">
            <h3>How to Play:</h3>
            <p>🎮 Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to control the snake</p>
            <p>🍎 Eat the red food to grow and gain points</p>
            <p>⚠️ Don't hit the walls or yourself!</p>
            <p>📊 Each food eaten = 10 points</p>
        </div>
        <div class="game-area">
            <h1>🐍 Snake Game</h1>
            <div class="info">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="high-score-box">High Score: <span id="highScore">0</span></div>
            </div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="controls">
                <button id="startBtn">Start Game</button>
                <button id="pauseBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div class="options">
                <h3>Options:</h3>
                <div class="checkbox-container">
                    <input type="checkbox" id="bypassWalls" />
                    <label for="bypassWalls">Easy Mode (bypass walls)</label>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOverModal">
        <h2>Game Over!</h2>
        <p>Final Score: <strong id="finalScore">0</strong></p>
        <p id="newRecord" style="color: #667eea; display: none;">🎉 New Record!</p>
        <button onclick="restartGame()">Play Again</button>
        <button onclick="closeGameOver()">Close</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }
        ];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = generateFood();
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoopId = null;
        let bypassWalls = false;

        document.getElementById('highScore').textContent = highScore;

        // Event listener for bypass walls checkbox
        document.getElementById('bypassWalls').addEventListener('change', function(e) {
            bypassWalls = e.target.checked;
        });

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        document.addEventListener('keydown', handleKeyPress);

        function handleKeyPress(e) {
            if (!gameRunning) return;

            switch (e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        }

        function generateFood() {
            let newFood;
            let validPosition = false;

            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                validPosition = !snake.some(
                    segment => segment.x === newFood.x && segment.y === newFood.y
                );
            }

            return newFood;
        }

        function startGame() {
            if (gameRunning && !gamePaused) return;

            gameRunning = true;
            gamePaused = false;
            document.getElementById('pauseBtn').textContent = 'Pause';

            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(update, 100);
        }

        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? 'Resume' : 'Pause';

            if (gamePaused) {
                clearInterval(gameLoopId);
            } else {
                gameLoopId = setInterval(update, 100);
            }
        }

        function resetGame() {
            clearInterval(gameLoopId);
            snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            food = generateFood();
            score = 0;
            gameRunning = false;
            gamePaused = false;
            document.getElementById('score').textContent = score;
            document.getElementById('pauseBtn').textContent = 'Pause';
            draw();
        }

        function update() {
            direction = nextDirection;
            let head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                if (bypassWalls) {
                    // Wrap around to the other side
                    if (head.x < 0) head.x = tileCount - 1;
                    if (head.x >= tileCount) head.x = 0;
                    if (head.y < 0) head.y = tileCount - 1;
                    if (head.y >= tileCount) head.y = 0;
                } else {
                    endGame();
                    return;
                }
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                food = generateFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00ff00';
                } else {
                    ctx.fillStyle = '#00cc00';
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            // Draw food
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function endGame() {
            clearInterval(gameLoopId);
            gameRunning = false;

            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                isNewRecord = true;
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('newRecord').style.display = isNewRecord ? 'block' : 'none';
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('gameOverModal').style.display = 'block';
        }

        function restartGame() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('highScore').textContent = highScore;
            resetGame();
            startGame();
        }

        function closeGameOver() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('highScore').textContent = highScore;
        }

        // Initial draw
        draw();
    </script>
</body>

</html>
