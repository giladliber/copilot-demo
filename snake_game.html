<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .game-area {
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-box,
        .high-score-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            min-width: 150px;
        }

        canvas {
            border: 3px solid #333;
            background-color: #000;
            display: block;
            margin: 20px auto;
            border-radius: 5px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            text-align: left;
            font-size: 0.9em;
            color: #555;
            max-width: 250px;
            align-self: flex-start;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .instructions p {
            margin: 5px 0;
        }

        .options {
            margin-top: 15px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            text-align: left;
            font-size: 0.9em;
            color: #555;
            max-width: 250px;
        }

        .options h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            cursor: pointer;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-container label {
            cursor: pointer;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }

        .game-over h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .game-over p {
            color: #666;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
            margin-left: 5px;
            margin-right: 5px;
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="instructions">
            <h3>How to Play:</h3>
            <p>🎮 Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to control the snake</p>
            <p>🍎 Eat the red food to grow and gain points</p>
            <p>⚠️ Don't hit the walls or yourself!</p>
            <p>📊 Each food eaten = 10 points</p>
        </div>
        <div class="game-area">
            <h1>🐍 Snake Game</h1>
            <div class="info">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="high-score-box">High Score: <span id="highScore">0</span></div>
            </div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="controls">
                <button id="startBtn">Start Game</button>
                <button id="pauseBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div class="options">
                <h3>Options:</h3>
                <div class="checkbox-container">
                    <input type="checkbox" id="bypassWalls" />
                    <label for="bypassWalls">Easy Mode (bypass walls)</label>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOverModal">
        <h2>Game Over!</h2>
        <p>Final Score: <strong id="finalScore">0</strong></p>
        <p id="newRecord" style="color: #667eea; display: none;">🎉 New Record!</p>
        <button onclick="restartGame()">Play Again</button>
        <button onclick="closeGameOver()">Close</button>
    </div>

    <script src="snake-game.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const game = new SnakeGame(canvas);

        document.getElementById('highScore').textContent = game.highScore;

        // Event listener for bypass walls checkbox
        document.getElementById('bypassWalls').addEventListener('change', function(e) {
            game.setBypassWalls(e.target.checked);
        });

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', function() {
            game.startGame();
            document.getElementById('pauseBtn').textContent = 'Pause';
        });
        
        document.getElementById('pauseBtn').addEventListener('click', function() {
            const paused = game.togglePause();
            if (paused !== undefined) {
                document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
            }
        });
        
        document.getElementById('resetBtn').addEventListener('click', function() {
            game.resetGame();
            document.getElementById('score').textContent = game.score;
            document.getElementById('pauseBtn').textContent = 'Pause';
        });

        document.addEventListener('keydown', function(e) {
            if (game.handleKeyPress(e.key)) {
                e.preventDefault();
            }
        });

        // Override the game's update method to update the UI
        const originalUpdate = game.update.bind(game);
        game.update = function() {
            originalUpdate();
            document.getElementById('score').textContent = game.score;
        };

        // Override the game's endGame method to show modal
        const originalEndGame = game.endGame.bind(game);
        game.endGame = function() {
            const result = originalEndGame();
            
            document.getElementById('finalScore').textContent = result.score;
            document.getElementById('newRecord').style.display = result.isNewRecord ? 'block' : 'none';
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('gameOverModal').style.display = 'block';
            
            return result;
        };

        function restartGame() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('highScore').textContent = game.highScore;
            game.resetGame();
            game.startGame();
            document.getElementById('pauseBtn').textContent = 'Pause';
        }

        function closeGameOver() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('highScore').textContent = game.highScore;
        }

        // Initial draw
        game.draw();
    </script>
</body>

</html>
